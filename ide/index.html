<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆沙包 IDE — 浏览器网页版代码编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Cpath d='M9 11l7 5-7 5' fill='none' stroke='%234cc2ff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h6' fill='none' stroke='%234cc2ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.css">
<style>
/* ===== 主题变量（配色方案：vscode 默认 / matrix / vstudio） ===== */
:root{ /* VS Code Dark+ 界面 */
  --bg0:#1e1e1e; --bg1:#252526; --bg2:#2d2d30; --bg3:#333333; --bg4:#3c3c3c;
  --border:#3c3c3c; --border-soft:#333333;
  --text:#d4d4d4; --text-dim:#9d9d9d; --text-faint:#6e6e6e;
  --accent:#007acc; --accent-strong:#0e639c; --accent-ink:#ffffff;
  --ok:#4ec9b0; --warn:#cca700; --err:#f48771;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --editor-font:'Consolas','Courier New',ui-monospace,monospace;
  --hint-size:13px;
}
[data-theme="light"]{ /* VS Code Light+ 界面 */
  --bg0:#ffffff; --bg1:#f3f3f3; --bg2:#ececec; --bg3:#e1e1e1; --bg4:#d0d0d0;
  --border:#d4d4d4; --border-soft:#e6e6e6;
  --text:#333333; --text-dim:#666666; --text-faint:#999999;
  --accent:#007acc; --accent-strong:#005fb8; --accent-ink:#ffffff;
  --ok:#267f99; --warn:#9a6700; --err:#cd3131;
  --shadow:0 6px 24px rgba(140,149,159,.35);
}
[data-palette="matrix"]{ /* Matrix 黑客绿（恒深色） */
  --bg0:#000000; --bg1:#030803; --bg2:#071007; --bg3:#0b160b; --bg4:#122312;
  --border:#0f3d0f; --border-soft:#0a2a0a;
  --text:#c8ffc8; --text-dim:#5fbf5f; --text-faint:#3f7f3f;
  --accent:#00ff41; --accent-strong:#00cc34; --accent-ink:#001400;
  --ok:#00ff41; --warn:#e6c300; --err:#ff5555;
  --shadow:0 0 24px rgba(0,255,65,.25);
}
[data-palette="vstudio"]{ /* Visual Studio 经典（恒浅色） */
  --bg0:#dedede; --bg1:#f5f5f5; --bg2:#ececec; --bg3:#e0e0e0; --bg4:#cccccc;
  --border:#d0d0d0; --border-soft:#e0e0e0;
  --text:#1e1e1e; --text-dim:#505050; --text-faint:#888888;
  --accent:#0078d4; --accent-strong:#005a9e; --accent-ink:#ffffff;
  --ok:#107c10; --warn:#8a6d3b; --err:#e51400;
  --shadow:0 6px 24px rgba(120,120,120,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg0);color:var(--text);font-size:13px;
}
button,a{font-family:inherit;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px}
button:hover,a:hover{color:var(--text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
::selection{background:rgba(76,194,255,.28)}
/* ===== 整体布局 ===== */
#app{display:flex;flex-direction:column;height:100%}
#main{display:flex;flex:1;min-height:0}
/* ===== 顶部标题栏 ===== */
#titlebar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg1);border-bottom:1px solid var(--border);padding:0 10px;gap:8px;
}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-logo{width:20px;height:20px;flex:0 0 20px}
.app-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.tb-sep{width:1px;height:16px;background:var(--border)}
#breadcrumb{color:var(--text-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tb-btn{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;
  border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);font-size:12px;
  text-decoration:none;
}
.tb-btn:hover{color:var(--text);border-color:var(--bg4)}
.tb-btn svg{width:14px;height:14px}
#btn-run{
  background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;padding:4px 14px;
}
#btn-run:hover{background:var(--accent-strong);color:var(--accent-ink)}
#btn-run svg{width:11px;height:11px}
/* ===== 活动栏（最左侧图标栏） ===== */
#activitybar{
  width:46px;flex:0 0 46px;background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;gap:2px;min-height:0;
}
.ab-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px;
  color:var(--text-dim);position:relative;
}
.ab-btn svg{width:20px;height:20px}
.ab-btn:hover{background:var(--bg2);color:var(--text)}
.ab-btn.active{color:var(--text);border-left:2px solid var(--accent);border-radius:6px 0 0 6px}
.ab-spacer{flex:1}
.ab-btn .ab-badge{
  position:absolute;right:3px;bottom:3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--accent);color:var(--accent-ink);font-size:9px;line-height:14px;text-align:center;
}
/* ===== 侧栏 ===== */
#sidebar{
  width:232px;flex:0 0 232px;background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;position:relative;
}
#app.side-collapsed #sidebar{display:none}
.side-view{display:none;flex-direction:column;flex:1;min-height:0}
.side-view.show{display:flex}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:11px;letter-spacing:.08em;color:var(--text-faint)}
.side-actions{display:flex;gap:2px}
.side-actions button{padding:3px;border-radius:4px;display:inline-flex}
.side-actions button:hover{background:var(--bg3);color:var(--text)}
.side-actions svg{width:14px;height:14px}
.side-search{padding:0 8px 6px}
.side-search input{
  width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:12px;outline:none;
}
.side-search input:focus{border-color:var(--accent)}
#tree{flex:1;overflow:auto;padding:2px 0 12px;min-height:0}
#tree::-webkit-scrollbar,.pv-bar{scrollbar-width:thin}
/* 树节点 */
.tree-node{user-select:none}
.tree-row{
  display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;height:26px;cursor:pointer;
  color:var(--text-dim);white-space:nowrap;position:relative;
}
.tree-row:hover{background:var(--bg2);color:var(--text)}
.tree-row.active{background:rgba(76,194,255,.13);color:var(--text)}
[data-theme="light"] .tree-row.active{background:rgba(9,105,218,.10)}
.tree-row svg{width:15px;height:15px;flex:0 0 15px}
.tree-chevron{width:14px;height:14px;flex:0 0 14px;transition:transform .12s}
.tree-chevron.open{transform:rotate(90deg)}
.tree-chevron.blank{visibility:hidden}
.tree-name{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tree-file{color:var(--text-dim)}
.tree-file.active{color:var(--text)}
.tree-dirty{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}
.tree-empty{padding:16px 12px;color:var(--text-faint);font-size:12px;line-height:1.7}
/* ===== 工作台 ===== */
#workbench{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg0)}
#tabbar{display:flex;align-items:stretch;background:var(--bg1);border-bottom:1px solid var(--border);height:34px;overflow-x:auto;scrollbar-width:none}
#tabbar::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:6px;padding:0 10px;max-width:180px;min-width:80px;
  border-right:1px solid var(--border);color:var(--text-dim);font-size:12.5px;cursor:pointer;position:relative;
}
.tab .tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tab-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px;display:none}
.tab.dirty .tab-dot{display:block}
.tab.active{background:var(--bg0);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
[data-theme="light"] .tab.active{background:var(--bg1)}
.tab .tab-close{padding:2px;border-radius:3px;display:inline-flex;flex:0 0 14px}
.tab .tab-close:hover{background:var(--bg3);color:var(--text)}
.tab .tab-close svg{width:11px;height:11px}
#editor-area{flex:1;min-height:0;position:relative}
#cm-host{position:absolute;inset:0}
#replace-bar[hidden]{display:none}
#replace-bar{position:absolute;top:8px;left:12px;right:12px;z-index:20;display:flex;gap:6px;align-items:center;background:var(--bg1);border:1px solid var(--border-soft);border-radius:7px;padding:5px 7px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:640px}
#replace-bar input{background:var(--bg0);border:1px solid var(--border-soft);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12.5px;width:110px}
#replace-bar input:focus{outline:none;border-color:var(--accent)}
#replace-bar button{background:var(--bg2);color:var(--text);border:1px solid var(--border-soft);border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;flex:0 0 auto}
#replace-bar button:hover{border-color:var(--accent);color:var(--accent)}
#replace-bar #rb-close{font-size:14px;line-height:1;padding:3px 7px}
.help-box{max-width:380px}
.help-box .modal-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--border-soft);margin-bottom:8px}
.help-box .modal-head button{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:2px 6px}
.help-box .modal-head button:hover{color:var(--text)}
.help-body{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto}
.help-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 4px;font-size:12.5px;border-bottom:1px dashed var(--border-soft)}
.help-row:last-child{border-bottom:none}
.help-row span{font-family:Consolas,monospace;color:var(--accent);white-space:nowrap}
.help-row em{font-style:normal;color:var(--text-dim);text-align:right}
#cm-host .CodeMirror{height:100%;background:var(--bg0);color:var(--text);font-size:14px}
#cm-host .CodeMirror-gutters{background:var(--bg0);border-right:1px solid var(--border-soft)}
#cm-host .CodeMirror-linenumber{color:var(--text-faint)}
#cm-host .CodeMirror-cursor{border-left:2px solid var(--accent)}
#cm-host .CodeMirror-selected{background:rgba(76,194,255,.18)}
#cm-host .CodeMirror-activeline-background{background:rgba(255,255,255,.035)}
#cm-host .CodeMirror-matchingbracket{color:var(--accent);outline:1px solid var(--accent)}
#editor-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-faint)}
#editor-empty svg{width:52px;height:52px;opacity:.5}
#editor-empty p{font-size:13px}
/* 语法高亮 token（VS Code Dark+ 配色） */
.cm-s-ide .cm-keyword{color:#C586C0}
.cm-s-ide .cm-type{color:#4EC9B0}
.cm-s-ide .cm-atom{color:#569CD6}
.cm-s-ide .cm-number{color:#B5CEA8}
.cm-s-ide .cm-def{color:#4EC9B0}
.cm-s-ide .cm-variable{color:var(--text)}
.cm-s-ide .cm-variable-2{color:#9CDCFE}
.cm-s-ide .cm-property{color:#9CDCFE}
.cm-s-ide .cm-string{color:#CE9178}
.cm-s-ide .cm-string-2{color:#CE9178}
.cm-s-ide .cm-comment{color:#6A9955;font-style:italic}
.cm-s-ide .cm-tag{color:#569CD6}
.cm-s-ide .cm-attribute{color:#9CDCFE}
.cm-s-ide .cm-qualifier{color:#569CD6}
.cm-s-ide .cm-builtin{color:#4EC9B0}
.cm-s-ide .cm-meta{color:#569CD6}
.cm-s-ide .cm-operator{color:#D4D4D4}
.cm-s-ide .cm-header{color:#569CD6;font-weight:600}
.cm-s-ide .cm-link{color:#569CD6}
.cm-s-ide .cm-bracket{color:#D4D4D4}
.cm-s-ide .cm-error{color:#F44747}
/* 浅色主题（VS Code Light+ 配色） */
[data-theme="light"] .cm-s-ide .cm-keyword{color:#AF00DB}
[data-theme="light"] .cm-s-ide .cm-type{color:#267F99}
[data-theme="light"] .cm-s-ide .cm-atom{color:#267F99}
[data-theme="light"] .cm-s-ide .cm-number{color:#098658}
[data-theme="light"] .cm-s-ide .cm-def{color:#267F99}
[data-theme="light"] .cm-s-ide .cm-variable-2{color:#001080}
[data-theme="light"] .cm-s-ide .cm-property{color:#0451A5}
[data-theme="light"] .cm-s-ide .cm-string{color:#A31515}
[data-theme="light"] .cm-s-ide .cm-string-2{color:#A31515}
[data-theme="light"] .cm-s-ide .cm-comment{color:#008000}
[data-theme="light"] .cm-s-ide .cm-tag{color:#800000}
[data-theme="light"] .cm-s-ide .cm-attribute{color:#E50000}
[data-theme="light"] .cm-s-ide .cm-qualifier{color:#800000}
[data-theme="light"] .cm-s-ide .cm-builtin{color:#267F99}
[data-theme="light"] .cm-s-ide .cm-meta{color:#800000}
[data-theme="light"] .cm-s-ide .cm-operator{color:#383A42}
[data-theme="light"] .cm-s-ide .cm-bracket{color:#383A42}
[data-theme="light"] .cm-s-ide .cm-error{color:#CD3131}
/* Matrix token（绿） */
[data-palette="matrix"] .cm-s-ide .cm-keyword{color:#00ff41}
[data-palette="matrix"] .cm-s-ide .cm-type{color:#3dffa0}
[data-palette="matrix"] .cm-s-ide .cm-atom{color:#7dff7d}
[data-palette="matrix"] .cm-s-ide .cm-number{color:#a5ff90}
[data-palette="matrix"] .cm-s-ide .cm-def{color:#00ff9d}
[data-palette="matrix"] .cm-s-ide .cm-variable{color:#d8ffd8}
[data-palette="matrix"] .cm-s-ide .cm-variable-2{color:#80ff80}
[data-palette="matrix"] .cm-s-ide .cm-property{color:#4dff88}
[data-palette="matrix"] .cm-s-ide .cm-string{color:#b3ff8f}
[data-palette="matrix"] .cm-s-ide .cm-string-2{color:#b3ff8f}
[data-palette="matrix"] .cm-s-ide .cm-comment{color:#4d7c4d}
[data-palette="matrix"] .cm-s-ide .cm-tag{color:#00e676}
[data-palette="matrix"] .cm-s-ide .cm-attribute{color:#7dff7d}
[data-palette="matrix"] .cm-s-ide .cm-qualifier{color:#00ff41}
[data-palette="matrix"] .cm-s-ide .cm-builtin{color:#00ff9d}
[data-palette="matrix"] .cm-s-ide .cm-meta{color:#5cff5c}
[data-palette="matrix"] .cm-s-ide .cm-operator{color:#9fff9f}
[data-palette="matrix"] .cm-s-ide .cm-header{color:#00ff41}
[data-palette="matrix"] .cm-s-ide .cm-link{color:#7dff7d}
[data-palette="matrix"] .cm-s-ide .cm-bracket{color:#9fff9f}
[data-palette="matrix"] .cm-s-ide .cm-error{color:#ff5555}
/* Visual Studio 经典 token */
[data-palette="vstudio"] .cm-s-ide .cm-keyword{color:#0000ff}
[data-palette="vstudio"] .cm-s-ide .cm-type{color:#2b91af}
[data-palette="vstudio"] .cm-s-ide .cm-atom{color:#0000ff}
[data-palette="vstudio"] .cm-s-ide .cm-number{color:#098658}
[data-palette="vstudio"] .cm-s-ide .cm-def{color:#795e26}
[data-palette="vstudio"] .cm-s-ide .cm-variable{color:#1e1e1e}
[data-palette="vstudio"] .cm-s-ide .cm-variable-2{color:#0000ff}
[data-palette="vstudio"] .cm-s-ide .cm-property{color:#795e26}
[data-palette="vstudio"] .cm-s-ide .cm-string{color:#a31515}
[data-palette="vstudio"] .cm-s-ide .cm-string-2{color:#a31515}
[data-palette="vstudio"] .cm-s-ide .cm-comment{color:#008000}
[data-palette="vstudio"] .cm-s-ide .cm-tag{color:#800000}
[data-palette="vstudio"] .cm-s-ide .cm-attribute{color:#ff0000}
[data-palette="vstudio"] .cm-s-ide .cm-qualifier{color:#0000ff}
[data-palette="vstudio"] .cm-s-ide .cm-builtin{color:#795e26}
[data-palette="vstudio"] .cm-s-ide .cm-meta{color:#800000}
[data-palette="vstudio"] .cm-s-ide .cm-operator{color:#1e1e1e}
[data-palette="vstudio"] .cm-s-ide .cm-header{color:#800000}
[data-palette="vstudio"] .cm-s-ide .cm-link{color:#0000ff}
[data-palette="vstudio"] .cm-s-ide .cm-bracket{color:#1e1e1e}
[data-palette="vstudio"] .cm-s-ide .cm-error{color:#e51400}
/* 提示弹窗字体大小 */
.CodeMirror-hints{font-size:var(--hint-size,13px);font-family:var(--editor-font),monospace}
.CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like{font-family:var(--editor-font),monospace}
/* ===== 预览分栏 ===== */
#preview{
  flex:0 0 46%;max-width:52%;border-left:1px solid var(--border);background:var(--bg1);
  display:flex;flex-direction:column;min-width:0;
}
#preview[hidden]{display:none}
.pv-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dim)}
.pv-bar button{padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.pv-bar button:hover{background:var(--bg3);color:var(--text)}
.pv-bar svg{width:12px;height:12px}
#pv-frame{flex:1;border:none;background:#fff;width:100%}
/* ===== 底部状态栏 ===== */
#statusbar{
  height:24px;flex:0 0 24px;display:flex;align-items:center;gap:12px;padding:0 10px;
  background:var(--accent-strong);color:var(--accent-ink);font-size:11.5px;
}
[data-theme="light"] #statusbar{background:var(--accent-strong);color:#fff}
#statusbar .spacer{flex:1}
#statusbar button{padding:1px 5px;border-radius:3px;color:var(--accent-ink);opacity:.85}
#statusbar button:hover{opacity:1;background:rgba(255,255,255,.18)}
#statusbar svg{width:12px;height:12px}
/* ===== 底部输出面板 ===== */
#panel{
  flex:0 0 168px;background:var(--bg1);border-top:1px solid var(--border);display:flex;flex-direction:column;min-height:0;
}
#app.panel-collapsed #panel{display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:28px;border-bottom:1px solid var(--border)}
.panel-head .ptab{font-size:11px;letter-spacing:.08em;color:var(--text-faint);padding:4px 2px;border-bottom:2px solid transparent}
.panel-head .ptab.active{color:var(--text);border-bottom-color:var(--accent)}
.panel-actions{display:flex;gap:4px}
.panel-actions button{padding:2px 8px;border-radius:4px;font-size:12px;color:var(--text-dim)}
.panel-actions button:hover{background:var(--bg3);color:var(--text)}
#output{flex:1;overflow:auto;padding:8px 12px;font-family:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",monospace;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-height:0}
#output::-webkit-scrollbar{width:10px}
#output::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}
.out-line{display:flex;gap:8px;align-items:baseline}
.out-time{color:var(--text-faint);flex:0 0 auto;font-size:11px}
.out-msg{flex:1}
.out-system{color:var(--text-dim)}
.out-info{color:var(--accent)}
.out-ok{color:var(--ok)}
.out-warn{color:var(--warn)}
.out-err{color:var(--err)}
/* ===== 右键菜单 ===== */
#ctx-menu{
  position:fixed;z-index:100;min-width:150px;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;box-shadow:var(--shadow);padding:4px;display:none;
}
#ctx-menu.show{display:block}
.ctx-item{padding:5px 10px;border-radius:4px;font-size:12.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--accent);color:var(--accent-ink)}
.ctx-item.danger:hover{background:var(--err);color:#fff}
.ctx-item svg{width:13px;height:13px}
.ctx-sep{height:1px;background:var(--border);margin:4px 6px}
/* ===== 弹窗 ===== */
#modal{
  position:fixed;inset:0;z-index:200;background:rgba(5,8,14,.6);display:none;align-items:center;justify-content:center;
}
#modal.show{display:flex}
#help-modal{position:fixed;inset:0;z-index:210;background:rgba(5,8,14,.6);display:none;align-items:center;justify-content:center}
#help-modal.show{display:flex}
.modal-box{
  width:340px;max-width:90vw;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);padding:16px;
}
.modal-title{font-size:14px;font-weight:600;margin-bottom:10px}
.modal-msg{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.6}
.modal-box input{
  width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg0);
  color:var(--text);font-size:13px;outline:none;margin-bottom:14px;
}
.modal-box input:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-actions button{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.modal-actions button:hover{border-color:var(--bg4)}
.modal-actions .primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
/* ===== Toast ===== */
#toast{
  position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(12px);z-index:300;
  background:var(--bg3);color:var(--text);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:8px;padding:11px 20px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);
  opacity:0;transition:all .18s;pointer-events:none;max-width:82vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 自动补全提示 ===== */
#app .CodeMirror-hints{
  z-index:120;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow);font-family:ui-monospace,Consolas,monospace;font-size:13px;
  padding:4px;max-height:240px;overflow-y:auto;
}
#app .CodeMirror-hint{color:var(--text-dim);padding:2px 10px;border-radius:4px;cursor:pointer}
#app li.CodeMirror-hint-active{background:var(--accent);color:var(--accent-ink)}
/* ===== 语言选择菜单 ===== */
#lang-menu{
  position:fixed;z-index:110;min-width:150px;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;box-shadow:var(--shadow);padding:4px;display:none;max-height:260px;overflow-y:auto;
}
#lang-menu.show{display:block}
.lang-item{padding:5px 10px;border-radius:4px;font-size:12.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}
.lang-item:hover{background:var(--bg3)}
.lang-item.active{color:var(--accent);font-weight:600}
#st-lang{cursor:pointer;text-decoration:underline dotted}
/* ===== 设置面板 ===== */
#settings{
  position:fixed;inset:0;z-index:220;background:rgba(5,8,14,.62);display:none;align-items:center;justify-content:center;
}
#settings.show{display:flex}
.settings-box{
  width:min(720px,92vw);background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;
}
.settings-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.settings-head button{padding:3px;border-radius:5px;display:inline-flex}
.settings-head button:hover{background:var(--bg3);color:var(--text)}
.settings-head svg{width:14px;height:14px}
.settings-body{padding:6px 20px 18px;max-height:78vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:2px}
.set-title{font-size:11px;letter-spacing:.08em;color:var(--text-faint);margin:14px 0 4px;padding-top:8px;border-top:1px solid var(--border-soft);grid-column:1/-1}
.set-title:first-child{border-top:none;margin-top:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}
.set-label{color:var(--text);flex:0 0 auto}
.set-control{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.set-control input[type="number"]{
  width:66px;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg0);
  color:var(--text);font-size:13px;outline:none;
}
.set-control input[type="number"]:focus{border-color:var(--accent)}
.set-control button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.set-control button:hover{border-color:var(--bg4)}
.set-unit{color:var(--text-faint);font-size:12px}
.set-theme{display:flex;gap:8px}
.set-theme label{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;
  border:1px solid var(--border);cursor:pointer;font-size:12.5px;color:var(--text-dim);
}
.set-theme label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.set-theme input{accent-color:var(--accent)}
.set-theme{flex-wrap:wrap}
.set-theme.set-palette label{padding:3px 8px;font-size:12px}
.set-control select{
  padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:12.5px;outline:none;max-width:190px;
}
.set-control select:focus{border-color:var(--accent)}
.set-btn{
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:12.5px;
}
.set-btn:hover{border-color:var(--accent);color:var(--accent)}
/* 配色自定义 */
#btn-custom-palette{margin-top:2px}
#custom-palette{
  position:fixed;inset:0;z-index:230;background:rgba(5,8,14,.62);display:none;align-items:center;justify-content:center;
}
#custom-palette.show{display:flex}
.cp-box{width:min(480px,92vw);background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.cp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.cp-head button{padding:3px;border-radius:5px;display:inline-flex}
.cp-head button:hover{background:var(--bg3);color:var(--text)}
.cp-head svg{width:14px;height:14px}
.cp-body{padding:14px 18px;max-height:72vh;overflow:auto}
.cp-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--border-soft)}
.cp-row .cp-name{color:var(--text)}
.cp-row .cp-ctrl{display:flex;align-items:center;gap:8px}
.cp-row input[type="color"]{width:34px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg0);padding:2px;cursor:pointer}
.cp-row .cp-hex{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim);min-width:74px}
.cp-hint{font-size:12px;color:var(--text-faint);margin:6px 0 10px;line-height:1.6}
.cp-actions{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.cp-actions button{flex:1;padding:7px 0;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px}
.cp-actions button:hover{border-color:var(--accent);color:var(--accent)}
.cp-actions .primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.cp-actions .primary:hover{background:var(--accent-strong);color:var(--accent-ink)}
/* 空状态按钮 */
.empty-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.empty-actions button{
  display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);font-size:13px;
}
.empty-actions button:hover{border-color:var(--accent);color:var(--accent)}
.empty-actions button svg{width:14px;height:14px}
.empty-actions .primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.empty-actions .primary:hover{background:var(--accent-strong);color:var(--accent-ink)}
/* 搜索视图 */
.sr-input{padding:0 8px 6px}
.sr-input input{
  width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:12px;outline:none;
}
.sr-input input:focus{border-color:var(--accent)}
#search-results{flex:1;overflow:auto;padding:2px 6px 12px;min-height:0}
.sr-group{font-size:11px;color:var(--text-faint);padding:8px 6px 3px;letter-spacing:.05em}
.sr-item{padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.sr-item:hover{background:var(--bg2)}
.sr-item .sr-name{font-size:12.5px;color:var(--text);display:flex;gap:6px;align-items:center}
.sr-item .sr-name svg{width:12px;height:12px;flex:0 0 12px;color:var(--text-faint)}
.sr-item .sr-line{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,monospace}
.sr-empty{padding:18px 10px;color:var(--text-faint);font-size:12px;line-height:1.7}
/* CPH 调试视图 */
.cph-body{flex:1;overflow:auto;padding:8px 10px 14px;min-height:0;display:flex;flex-direction:column;gap:8px}
.cph-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cph-file{font-size:12px;color:var(--accent);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;flex:1}
.cph-tools{display:flex;gap:6px;flex:0 0 auto}
.cph-tools button,.cph-case-run,.cph-case-del{
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);
  font-size:12px;font-weight:600;cursor:pointer;
}
.cph-tools button:hover,.cph-case-run:hover{background:var(--accent);color:var(--accent-ink)}
.cph-tools button:disabled,.cph-case-run:disabled{opacity:.5;cursor:default;pointer-events:none}
#cph-run-all{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#cph-run-all:hover{background:var(--accent-strong)}
#cph-run-all:disabled{opacity:.6;pointer-events:none}
.cph-case{
  background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  display:flex;flex-direction:column;gap:5px;
}
.cph-case.running{border-color:var(--accent)}
.cph-case-head{display:flex;align-items:center;justify-content:space-between;gap:6}
.cph-case-head .cph-case-no{font-size:11px;font-weight:700;color:var(--text);letter-spacing:.04em}
.cph-case-head .cph-case-btns{display:flex;gap:6px;align-items:center}
.cph-case-del{color:var(--text-faint);font-size:11px;padding:3px 7px}
.cph-case-del:hover{background:var(--err);color:#fff;border-color:transparent}
.cph-body label{font-size:11px;color:var(--text-faint);letter-spacing:.05em;margin-top:2px}
.cph-body textarea{
  width:100%;min-height:48px;resize:vertical;padding:6px 8px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg0);color:var(--text);font-size:12.5px;font-family:Consolas,monospace;outline:none;line-height:1.5;box-sizing:border-box;
}
.cph-body textarea:focus{border-color:var(--accent)}
.cph-case-verdict{font-size:12px;font-weight:600;padding:2px 0;min-height:16px}
.cph-case-verdict.ok{color:var(--ok)}
.cph-case-verdict.bad{color:var(--err)}
.cph-case-verdict.wait{color:var(--warn)}
.cph-case-verdict.dim{color:var(--text-faint);font-weight:400}
.cph-case-out{
  background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:7px 9px;
  font-family:Consolas,monospace;font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;
  max-height:180px;overflow:auto;line-height:1.5;margin:0;
}
.cph-case-out[hidden]{display:none}
.cph-tip{font-size:11px;color:var(--text-faint);line-height:1.6;margin:2px 0 0}
#st-syntax{font-size:12px;white-space:nowrap}
/* ===== 响应式 ===== */
@media (max-width:860px){
  #sidebar{position:absolute;left:0;top:38px;bottom:0;z-index:50;width:220px;box-shadow:var(--shadow)}
  #app.side-collapsed #sidebar{display:block;transform:translateX(-100%)}
  #sidebar{transition:transform .15s}
  #preview{flex:0 0 100%;max-width:100%}
  #titlebar{flex-wrap:nowrap}
  .tb-hide-sm{display:none}
  .side-search input, .modal-box input{font-size:16px}
}
@media (max-width:560px){
  #panel{flex-basis:140px}
}
</style>
</head>

      </button>

      <button id="btn-run" class="tb-btn" title="运行当前文件（Ctrl+Enter）">

      </button>
      <button id="btn-settings" class="tb-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" /></svg>
      </button>
    </div>
  </header>
  <!-- ===== 中部：活动栏 + 侧栏 + 工作台 ===== -->
  <div id="main">
    <nav id="activitybar" title="活动栏">
      <button class="ab-btn active" id="ab-explorer" title="资源管理器（Ctrl+Shift+1）" data-view="explorer">

    <aside id="sidebar">

        <div class="side-head">
          <span>资源管理器</span>
